# JobForge local development and demo environment.
# Usage: docker compose -f deploy/compose.yaml up -d
#
# Services: PostgreSQL, API, Scheduler, Gateway, Outbox Publisher, 2 Workers.
# Two workers enable kill/recovery demonstrations (PRD 18 steps 3-4).
#
# Optional observability profile (PRD v0.2 FR-632, opt-in per Q3):
#   docker compose -f deploy/compose.yaml --profile obs up -d
# adds Prometheus + Grafana scraping each service's :6060/metrics.
# The default `up` behavior is unchanged: no observability dependency.
#
# Optional durable-events profile (PRD v0.3 §10.2, ADR-0006):
#   docker compose -f deploy/compose.yaml --profile durable-events up -d
# adds Redis with AOF plus the optional transactional reference consumer.
# The publisher transport itself is selected via the
# JOBFORGE_OUTBOX_TRANSPORT env var (default stays the non-durable notify),
# so enabling the profile never creates a second publisher competing for
# published_at:
#   $env:JOBFORGE_OUTBOX_TRANSPORT = "redis_streams"
#   $env:JOBFORGE_REDIS_URL = "redis://localhost:6379/0"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobforge
      POSTGRES_PASSWORD: jobforge
      POSTGRES_DB: jobforge
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobforge"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["api"]
    environment:
      JOBFORGE_DATABASE_URL: "postgres://jobforge:jobforge@postgres:5432/jobforge?sslmode=disable"
      JOBFORGE_HTTP_ADDR: ":8080"
      JOBFORGE_API_KEYS: "dev-api-key=dev-tenant"
      JOBFORGE_TASK_TYPES: "demo.echo,demo.sleep,demo.fail,demo.idempotent_effect,demo.http,pagewise.reindex"
      JOBFORGE_LEASE_TTL: "30s"
      JOBFORGE_SCAN_INTERVAL: "1s"
      JOBFORGE_OTEL_EXPORTER: "stdout"
      JOBFORGE_METRICS_ADDR: "0.0.0.0:6060"
    ports:
      - "8080:8080"
      - "6060:6060"
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["scheduler"]
    environment:
      JOBFORGE_DATABASE_URL: "postgres://jobforge:jobforge@postgres:5432/jobforge?sslmode=disable"
      JOBFORGE_SCAN_INTERVAL: "1s"
      JOBFORGE_OTEL_EXPORTER: "stdout"
      JOBFORGE_METRICS_ADDR: "0.0.0.0:6060"
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["gateway"]
    environment:
      JOBFORGE_DATABASE_URL: "postgres://jobforge:jobforge@postgres:5432/jobforge?sslmode=disable"
      JOBFORGE_GRPC_ADDR: ":9090"
      JOBFORGE_TASK_TYPES: "demo.echo,demo.sleep,demo.fail,demo.idempotent_effect,demo.http,pagewise.reindex"
      JOBFORGE_LEASE_TTL: "30s"
      # Gateway-advertised cadence. Workers omit the local override and adopt
      # this value from RegisterResponse (ADR-0008).
      JOBFORGE_HEARTBEAT_INTERVAL: "${JOBFORGE_HEARTBEAT_INTERVAL:-5s}"
      JOBFORGE_OTEL_EXPORTER: "stdout"
      JOBFORGE_METRICS_ADDR: "0.0.0.0:6060"
    ports:
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy

  publisher:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["publisher"]
    environment:
      JOBFORGE_DATABASE_URL: "postgres://jobforge:jobforge@postgres:5432/jobforge?sslmode=disable"
      JOBFORGE_OUTBOX_POLL_INTERVAL: "1s"
      JOBFORGE_OUTBOX_BATCH_SIZE: "100"
      JOBFORGE_OUTBOX_RETENTION: "168h"
      JOBFORGE_OUTBOX_CHANNEL: "jobforge_outbox"
      # Transport selection (PRD v0.3 FR-705): defaults to the v0.2-compatible
      # non-durable notify transport; set redis_streams together with the
      # durable-events profile for durable delivery (ADR-0006 §6).
      JOBFORGE_OUTBOX_TRANSPORT: "${JOBFORGE_OUTBOX_TRANSPORT:-notify}"
      JOBFORGE_REDIS_URL: "${JOBFORGE_REDIS_URL:-redis://redis:6379/0}"
      JOBFORGE_REDIS_STREAM_KEY: "${JOBFORGE_REDIS_STREAM_KEY:-jobforge:events}"
      JOBFORGE_OTEL_EXPORTER: "stdout"
      JOBFORGE_METRICS_ADDR: "0.0.0.0:6060"
    depends_on:
      postgres:
        condition: service_healthy

  # Durable event broker (PRD v0.3 §10.2, ADR-0006 §2): only started with
  # --profile durable-events. AOF (appendonly yes, everysec fsync) plus a
  # named volume makes the stream survive container restarts; AT-17 verifies
  # recovery with `docker compose stop/start` on this service.
  redis:
    image: redis:7-alpine
    profiles: ["durable-events"]
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Reference transactional consumer (PRD v0.3 FR-710~714). It is isolated
  # behind durable-events, so the default deployment remains PostgreSQL-only.
  # One consumer_inbox table represents this one logical group; additional
  # groups that need independent effects require an independent inbox schema.
  consumer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    profiles: ["durable-events"]
    command: ["consumer"]
    environment:
      JOBFORGE_DATABASE_URL: "postgres://jobforge:jobforge@postgres:5432/jobforge?sslmode=disable"
      JOBFORGE_REDIS_URL: "${JOBFORGE_REDIS_URL:-redis://redis:6379/0}"
      JOBFORGE_REDIS_STREAM_KEY: "${JOBFORGE_REDIS_STREAM_KEY:-jobforge:events}"
      JOBFORGE_CONSUMER_GROUP: "${JOBFORGE_CONSUMER_GROUP:-jobforge-reference-v1}"
      JOBFORGE_CONSUMER_BLOCK_TIMEOUT: "${JOBFORGE_CONSUMER_BLOCK_TIMEOUT:-2s}"
      JOBFORGE_CONSUMER_PENDING_SCAN_INTERVAL: "${JOBFORGE_CONSUMER_PENDING_SCAN_INTERVAL:-5s}"
      JOBFORGE_CONSUMER_PENDING_MIN_IDLE: "${JOBFORGE_CONSUMER_PENDING_MIN_IDLE:-30s}"
      JOBFORGE_CONSUMER_PROCESS_TIMEOUT: "${JOBFORGE_CONSUMER_PROCESS_TIMEOUT:-10s}"
      JOBFORGE_CONSUMER_MAX_DELIVERIES: "${JOBFORGE_CONSUMER_MAX_DELIVERIES:-5}"
      JOBFORGE_CONSUMER_RETRY_BASE: "${JOBFORGE_CONSUMER_RETRY_BASE:-1s}"
      JOBFORGE_CONSUMER_RETRY_MAX: "${JOBFORGE_CONSUMER_RETRY_MAX:-30s}"
      # Empty delegates to the binary's <stream>:poison derivation.
      JOBFORGE_CONSUMER_POISON_STREAM: "${JOBFORGE_CONSUMER_POISON_STREAM:-}"
      JOBFORGE_OTEL_EXPORTER: "stdout"
      JOBFORGE_METRICS_ADDR: "0.0.0.0:6060"
    ports:
      - "127.0.0.1::6060"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["worker"]
    environment:
      JOBFORGE_DATABASE_URL: "postgres://jobforge:jobforge@postgres:5432/jobforge?sslmode=disable"
      JOBFORGE_GATEWAY_ADDR: "gateway:9090"
      JOBFORGE_WORKER_ID: "worker-1"
      JOBFORGE_WORKER_QUEUE: "default"
      JOBFORGE_OTEL_EXPORTER: "stdout"
      JOBFORGE_METRICS_ADDR: "0.0.0.0:6060"
    depends_on:
      gateway:
        condition: service_started

  worker-2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["worker"]
    environment:
      JOBFORGE_DATABASE_URL: "postgres://jobforge:jobforge@postgres:5432/jobforge?sslmode=disable"
      JOBFORGE_GATEWAY_ADDR: "gateway:9090"
      JOBFORGE_WORKER_ID: "worker-2"
      JOBFORGE_WORKER_QUEUE: "default"
      JOBFORGE_OTEL_EXPORTER: "stdout"
      JOBFORGE_METRICS_ADDR: "0.0.0.0:6060"
    depends_on:
      gateway:
        condition: service_started

  # Optional observability stack (PRD v0.2 FR-632): only started with
  # --profile obs. Prometheus scrapes each service's debug-server metrics;
  # Grafana is provisioned with the Prometheus datasource.
  prometheus:
    image: prom/prometheus:latest
    profiles: ["obs"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      # Host port 9091: 9090 is already used by the gateway gRPC mapping.
      - "9091:9090"
    depends_on:
      - api
      - scheduler
      - gateway
      - publisher

  grafana:
    image: grafana/grafana:latest
    profiles: ["obs"]
    environment:
      # Local demo credentials only; not for any real environment.
      GF_SECURITY_ADMIN_PASSWORD: "jobforge"
    volumes:
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/jobforge.yaml:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  redisdata:
