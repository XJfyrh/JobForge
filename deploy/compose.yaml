# JobForge local development and demo environment.
# Usage: docker compose -f deploy/compose.yaml up -d
#
# Services: PostgreSQL, API, Scheduler, Gateway, Outbox Publisher, 2 Workers.
# Two workers enable kill/recovery demonstrations (PRD 18 steps 3-4).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobforge
      POSTGRES_PASSWORD: jobforge
      POSTGRES_DB: jobforge
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobforge"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["api"]
    environment:
      JOBFORGE_DATABASE_URL: "postgres://jobforge:jobforge@postgres:5432/jobforge?sslmode=disable"
      JOBFORGE_HTTP_ADDR: ":8080"
      JOBFORGE_API_KEYS: "dev-api-key=dev-tenant"
      JOBFORGE_LEASE_TTL: "30s"
      JOBFORGE_HEARTBEAT_INTERVAL: "10s"
      JOBFORGE_SCAN_INTERVAL: "1s"
      JOBFORGE_OTEL_EXPORTER: "stdout"
      JOBFORGE_METRICS_ADDR: "0.0.0.0:6060"
    ports:
      - "8080:8080"
      - "6060:6060"
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["scheduler"]
    environment:
      JOBFORGE_DATABASE_URL: "postgres://jobforge:jobforge@postgres:5432/jobforge?sslmode=disable"
      JOBFORGE_SCAN_INTERVAL: "1s"
      JOBFORGE_OTEL_EXPORTER: "stdout"
      JOBFORGE_METRICS_ADDR: "0.0.0.0:6060"
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["gateway"]
    environment:
      JOBFORGE_DATABASE_URL: "postgres://jobforge:jobforge@postgres:5432/jobforge?sslmode=disable"
      JOBFORGE_GRPC_ADDR: ":9090"
      JOBFORGE_LEASE_TTL: "30s"
      JOBFORGE_OTEL_EXPORTER: "stdout"
      JOBFORGE_METRICS_ADDR: "0.0.0.0:6060"
    ports:
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy

  publisher:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["publisher"]
    environment:
      JOBFORGE_DATABASE_URL: "postgres://jobforge:jobforge@postgres:5432/jobforge?sslmode=disable"
      JOBFORGE_OUTBOX_POLL_INTERVAL: "1s"
      JOBFORGE_OUTBOX_BATCH_SIZE: "100"
      JOBFORGE_OUTBOX_RETENTION: "168h"
      JOBFORGE_OUTBOX_CHANNEL: "jobforge_outbox"
      JOBFORGE_OTEL_EXPORTER: "stdout"
      JOBFORGE_METRICS_ADDR: "0.0.0.0:6060"
    depends_on:
      postgres:
        condition: service_healthy

  worker-1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["worker"]
    environment:
      JOBFORGE_DATABASE_URL: "postgres://jobforge:jobforge@postgres:5432/jobforge?sslmode=disable"
      JOBFORGE_GATEWAY_ADDR: "gateway:9090"
      JOBFORGE_WORKER_ID: "worker-1"
      JOBFORGE_WORKER_QUEUE: "default"
      JOBFORGE_HEARTBEAT_INTERVAL: "10s"
      JOBFORGE_OTEL_EXPORTER: "stdout"
      JOBFORGE_METRICS_ADDR: "0.0.0.0:6060"
    depends_on:
      gateway:
        condition: service_started

  worker-2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["worker"]
    environment:
      JOBFORGE_DATABASE_URL: "postgres://jobforge:jobforge@postgres:5432/jobforge?sslmode=disable"
      JOBFORGE_GATEWAY_ADDR: "gateway:9090"
      JOBFORGE_WORKER_ID: "worker-2"
      JOBFORGE_WORKER_QUEUE: "default"
      JOBFORGE_HEARTBEAT_INTERVAL: "10s"
      JOBFORGE_OTEL_EXPORTER: "stdout"
      JOBFORGE_METRICS_ADDR: "0.0.0.0:6060"
    depends_on:
      gateway:
        condition: service_started

volumes:
  pgdata:
