# Grafana datasource provisioning for the JobForge optional obs profile
# (PRD v0.2 FR-632). Mounted read-only at
# /etc/grafana/provisioning/datasources inside the grafana container.
#
# Registers the compose-internal Prometheus instance automatically so the
# jobforge_* metrics and the task dashboard work without manual setup.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: jobforge-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: jobforge-jaeger
  - name: Jaeger
    uid: jobforge-jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
