[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobforge-agent"
version = "0.1.0"
description = "Fixed registered single-step JobForge executor"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "opentelemetry-api>=1.30,<2"]

[tool.hatch.build.targets.wheel]
packages = ["jobforge_agent"]
