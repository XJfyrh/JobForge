[build-system]
requires = ["hatchling>=1.27.0,<2"]
build-backend = "hatchling.build"

[project]
name = "jobforge-agent"
version = "0.1.0"
description = "Fixed registered single-step JobForge executor"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.27,<1", "opentelemetry-api>=1.30,<2"]

[project.urls]
Repository = "https://github.com/XJfyrh/JobForge"
Documentation = "https://github.com/XJfyrh/JobForge/blob/main/docs/agent-v3/runtime.md"

[tool.hatch.build.targets.wheel]
packages = ["jobforge_agent"]
