line-length = 88
indent-width = 4
preview = false
respect-gitignore = true
extend-exclude = [
  "*.md",
  "docs",
  "gen",
  "**/*_pb2.py",
  "**/*_pb2_grpc.py",
]

[lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "B",
  "D",
]

[lint.pydocstyle]
convention = "google"

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
