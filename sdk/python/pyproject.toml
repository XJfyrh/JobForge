[project]
name = "jobforge"
version = "0.1.0"
description = "Python SDK for JobForge distributed task orchestration platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "XJfyrh" }]
dependencies = [
    "httpx>=0.27.0",
    "opentelemetry-api>=1.30,<2",
]

[project.optional-dependencies]
demo = [
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
]
dev = [
    "pytest>=8.0.0",
    "opentelemetry-sdk>=1.30,<2",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "PyYAML>=6,<7",
    "jsonschema>=4.26,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
