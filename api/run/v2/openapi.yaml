openapi: 3.1.0
info:
  title: JobForge Run API
  version: 2.0.0
  description: ADR-0017 S1-B source contract. At-least-once execution; external effects require business
    idempotency. Public operator can submit/cancel/retry; reader can only query. Cross-tenant resources
    return 404; missing role in own tenant returns 403. No model endpoint, fees, tenant, lease or arbitrary
    code can be supplied. SDK performs no hidden retry, redirect, polling or protected-reference fetch.
    No approval/write endpoints exist in this slice.
security:
- BearerAuth: []
paths:
  /v2/runs:
    post:
      operationId: submitRun
      summary: Create or reuse the first Run for a stable business intent
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/Tracestate'
      responses:
        '200':
          description: Accepted/reused operation or successful query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunSubmission'
        '400':
          description: INVALID_ARGUMENT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: CONFLICT / ALREADY_TERMINAL / INVALID_TRANSITION / PROFILE_UNAVAILABLE / BUDGET_EXHAUSTED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: QUEUE_OVERLOADED / RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: INTERNAL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: DEPENDENCY_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '201':
          description: New Run accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunSubmission'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRun'
        description: At most 4096 bytes. Strict UTF-8 JSON with no duplicate fields or trailing values.
    get:
      operationId: listRuns
      summary: List tenant Runs by descending creation time and ID
      parameters:
      - $ref: '#/components/parameters/State'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/Tracestate'
      responses:
        '200':
          description: Accepted/reused operation or successful query
