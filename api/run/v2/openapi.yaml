components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  parameters:
    RunID:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
      description: Submit scope is tenant+submit+key; cancel/retry scope is tenant+target Run+operation+key.
        Same canonical content returns the accepted object; changed content conflicts. A new operation
        key cannot fork an existing business root/successor.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    After:
      name: after
      in: query
      schema:
        type: integer
        minimum: 0
        maximum: 9007199254740991
        default: 0
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 4096
    State:
      name: state
      in: query
      schema:
        $ref: '#/components/schemas/RunState'
    Traceparent:
      name: traceparent
      in: header
      schema:
        type: string
      description: Optional W3C TraceContext. Not part of request identity.
    Tracestate:
      name: tracestate
      in: header
      schema:
        type: string
  schemas:
    RunState:
      type: string
      enum:
      - ready
      - running
      - stopping
      - retry_wait
      - awaiting_approval
      - succeeded
      - failed
      - cancelled
    SubmitRun:
      type: object
      additionalProperties: false
      required:
      - schema_version
      - ticket_id
      - business_request_key
      - profile_id
      - budget_batch_id
      properties:
        schema_version:
          type: integer
          const: 1
        ticket_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        business_request_key:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        profile_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        budget_batch_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        run_timeout_seconds:
          type: integer
          minimum: 1
          maximum: 86400
          default: 3600
      description: Strict UTF-8 JSON, at most 4096 bytes. Reject unknown/duplicate/case-alias fields,
        explicit null, trailing input and non-integer numeric forms. Normalize only the omitted timeout.
        Tenant and roles come solely from authentication.
    RetryRun:
      type: object
      additionalProperties: false
      required:
      - schema_version
      properties:
        schema_version:
          type: integer
          const: 1
        run_timeout_seconds:
          type: integer
          minimum: 1
          maximum: 86400
          default: 3600
      description: A successor inherits ticket, business intent, immutable profile and shared family/tenant/batch
        accounts. Retry never replenishes budget. The original business retry window is seven days.
    CancelRun:
      type: object
      additionalProperties: false
      required:
      - schema_version
      properties:
        schema_version:
          type: integer
          const: 1
    RunError:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 128
        message:
          type: string
          maxLength: 2048
      description: Execution errors remain data on HTTP 200 GET responses.
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/RunError'
      description: Sanitized nested error; no SQL, stack, credentials or full request content.
    TicketVersion:
      type: object
      additionalProperties: false
      required:
      - id
      - revision
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
    OrderVersion:
      type: object
      additionalProperties: false
      required:
      - id
      - exists
      - revision
      properties:
        id:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          - type: 'null'
        exists:
          type: boolean
        revision:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 9007199254740991
          - type: 'null'
      description: Missing rows retain the expected relationship ID; revision is null exactly when exists
        is false.
    DeliveryVersion:
      type: object
      additionalProperties: false
      required:
      - id
      - exists
      - aggregate_revision
      properties:
        id:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          - type: 'null'
        exists:
          type: boolean
        aggregate_revision:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 9007199254740991
          - type: 'null'
      description: Missing rows retain the expected relationship ID. No order implies null delivery ID.
        Aggregate revision is null exactly when exists is false.
    PolicyVersion:
      type: object
      additionalProperties: false
      required:
      - version
      - revision
      - corpus_sha256
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        corpus_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
    IndexVersion:
      type: object
      additionalProperties: false
      required:
      - id
      - profile_hash
      - content_hash
      properties:
        id:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        profile_hash:
          type: string
