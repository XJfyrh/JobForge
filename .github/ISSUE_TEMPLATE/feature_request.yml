name: Feature request
description: 提议与 JobForge 产品边界一致的新能力或改进
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请先检查 PRD 和现有 ADR。改变可靠性语义、公开协议、事实源或关键技术边界的提议必须附 ADR。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述用户、场景和当前阻碍，不要只描述期望实现。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明期望行为、边界和最小验收标准。
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 与版本范围的关系
      options:
        - P0 核心范围
        - P1 时间允许时扩展
        - 后续版本或待评审
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 说明考虑过的替代方案以及未选择的原因。

  - type: textarea
    id: compatibility
    attributes:
      label: 语义与兼容性影响
      description: 说明对状态机、API、Proto、migration、租户隔离、观测或安全的影响。
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收场景
      description: 列出正常路径和关键失败路径。
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交前确认
      options:
        - label: 我已检查 PRD、现有 Issue 和 ADR。
          required: true
        - label: 如果提议改变已冻结边界，我会同时提交 ADR。
          required: true
