# Required checks are selected by tools/ci_checks.py; see docs/tests.md.
name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select required checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go-lint: ${{ steps.plan.outputs.go-lint }}
      go-test: ${{ steps.plan.outputs.go-test }}
      python-lint: ${{ steps.plan.outputs.python-lint }}
      business-contract: ${{ steps.plan.outputs.business-contract }}
      executor-process-probe: ${{ steps.plan.outputs.executor-process-probe }}
      proto-lint: ${{ steps.plan.outputs.proto-lint }}
      agent-runtime-contract: ${{ steps.plan.outputs.agent-runtime-contract }}
      image-contract: ${{ steps.plan.outputs.image-contract }}
      observability-config: ${{ steps.plan.outputs.observability-config }}
      selected: ${{ steps.plan.outputs.selected }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            python -m tools.ci_checks plan --base "$BASE_SHA"
          else
            python -m tools.ci_checks plan --full
          fi

  docs:
    name: Documentation and check routing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check selection, gate and partition regressions
        run: python -m unittest discover -s tools/ci_tests -v
      - name: Local links, anchors and Linux path case
        run: python -m tools.ci_docs

  go-lint:
    needs: changes
    if: needs.changes.outputs.go-lint == 'true'
    name: Go build, vet & golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install shared lint version
        run: |
          version="$(python -c 'from tools.check import GOLANGCI_VERSION; print(GOLANGCI_VERSION)')"
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v$version"
      - name: Shared build, vet, lint and workflow checks
        run: python -m tools.check --only go-lint
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Business UI projection tests
        run: node --test internal/run/httpapi/ui/tests/*.test.mjs

  go-test:
    needs: changes
    if: needs.changes.outputs.go-test == 'true'
    name: Go test (race, real PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobforge
          POSTGRES_PASSWORD: jobforge
          POSTGRES_DB: jobforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobforge -d jobforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Durable-event tests (PRD v0.3 §10.2): AOF-enabled Redis so AT-17/18/20
      # and NFR-303 run in CI with the same contract as the Windows compose
      # durable-events profile. The container filesystem survives stop/start,
      # which is what the restart-recovery tests rely on.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Credentials mirror deploy/compose.yaml local development values only.
      JOBFORGE_TEST_DSN: postgres://jobforge:jobforge@localhost:5432/jobforge?sslmode=disable
      JOBFORGE_TEST_REDIS_URL: redis://localhost:6379/0
      JOBFORGE_TEST_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-lint.txt
      - name: Install SDK for real HTTP contract
        run: |
          python -m pip install --requirement tools/requirements-lint.txt
          python -m pip install --no-deps ./sdk/python
      - name: Configure Redis AOF and resolve container name
        run: |
          redis_container="$(docker ps --filter ancestor=redis:7-alpine --format '{{.Names}}' | head -1)"
          test -n "$redis_container"
          docker exec "$redis_container" redis-cli CONFIG SET appendonly yes
          docker exec "$redis_container" redis-cli CONFIG SET appendfsync everysec
          test "$(docker exec "$redis_container" redis-cli --raw CONFIG GET appendonly | tail -1)" = "yes"
          test "$(docker exec "$redis_container" redis-cli --raw CONFIG GET appendfsync | tail -1)" = "everysec"
          echo "JOBFORGE_TEST_REDIS_CONTAINER=$redis_container" >> "$GITHUB_ENV"
      - name: Test with race detector
        run: python -m tools.check --only go-test

  python-lint:
    needs: changes
    if: needs.changes.outputs.python-lint == 'true'
    name: Python tests, lint, types and SQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-lint.txt
      - name: Install pinned toolchain and SDK
        run: |
          python -m pip install --requirement tools/requirements-lint.txt
          python -m pip install --no-deps ./sdk/python
      - name: Python and SQL checks
        run: python -m tools.check --only python-lint

  business-contract:
    needs: changes
    if: needs.changes.outputs.business-contract == 'true'
    name: Agent S1 business (real pgvector, HTTP, race)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-lint.txt
      - name: Install business adapter dependencies
        run: python -m pip install --requirement tools/requirements-lint.txt
      - name: Start isolated business database
        run: docker compose -f deploy/compose.agent.yaml up -d --wait business-postgres
      - name: Business database and HTTP contracts
        env:
          JOBFORGE_BUSINESS_TEST_DSN: postgres://jobforge_business_bootstrap:jobforge_business_bootstrap@127.0.0.1:5434/jobforge_business?sslmode=disable
          JOBFORGE_TEST_PYTHON: python
        run: go test -race -count=1 -v ./internal/business ./internal/jsonstrict ./tests/integration/business
      - name: Build the runtime image without evaluation labels
        run: docker compose -f deploy/compose.agent.yaml build business
      - name: Clean isolated development data
        if: always()
        run: docker compose -f deploy/compose.agent.yaml down --volumes

  executor-process-probe:
    needs: changes
    if: needs.changes.outputs.executor-process-probe == 'true'
    name: Agent S0 executor (Linux process faults, race)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Go/Python probe image
        run: docker build --tag jobforge-executor-probe:s0 --file tools/executorprobe/Dockerfile .
      - name: Run real process lifecycle tests
        run: >-
          docker run --rm --init --network none --cpus 1 --memory 256m
          --pids-limit 64 jobforge-executor-probe:s0
      - name: Verify shared Go and Python BOOTTIME with race detector
        run: >-
          docker run --rm --init --network none --cpus 1 --memory 256m
          --pids-limit 64 jobforge-executor-probe:s0
          ./clock.test -test.v -test.timeout=30s

  proto-lint:
    needs: changes
    if: needs.changes.outputs.proto-lint == 'true'
    name: Buf lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.72.0
          github_token: ${{ github.token }}
      - name: Buf lint and compatibility
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          buf lint
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags origin "$BASE_SHA"
            buf breaking --against ".git#ref=$BASE_SHA"
          fi

  agent-runtime-contract:
    needs: changes
    if: needs.changes.outputs.agent-runtime-contract == 'true'
    name: Agent runtime (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [core, recovery, deadlines]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobforge
          POSTGRES_PASSWORD: jobforge
          POSTGRES_DB: jobforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobforge -d jobforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      business-postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: jobforge_business_bootstrap
          POSTGRES_PASSWORD: jobforge_business_bootstrap
          POSTGRES_DB: jobforge_business
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U jobforge_business_bootstrap -d jobforge_business"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build fixed installed process checks
        if: matrix.shard == 'core'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/agentruntimecheck/Dockerfile
          target: process-check
          load: true
          tags: jobforge-agent-runtime:process
          cache-from: type=gha,scope=runtime-process
          cache-to: type=gha,mode=max,scope=runtime-process
      - name: Actual guardian, step and parent death with race
        if: matrix.shard == 'core'
        run: docker run --rm --init --network none --cpus 1 --memory 384m --pids-limit 64 jobforge-agent-runtime:process
      - name: Build explicitly synthetic HTTP mechanism image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/agentruntimecheck/Dockerfile
          target: integration-check
          load: true
          tags: jobforge-agent-runtime:integration
          cache-from: type=gha,scope=runtime-${{ matrix.shard }}
          cache-to: type=gha,mode=max,scope=runtime-${{ matrix.shard }}
      - name: Coordinator ordering with the real Linux clock
        if: matrix.shard == 'core'
        run: docker run --rm --init --network none --cpus 1 --memory 384m --pids-limit 64 jobforge-agent-runtime:integration /app/worker.test -test.v -test.timeout=120s
      - name: Free local Run through public HTTP and independent approval
        if: matrix.shard == 'core'
        run: |
          docker tag jobforge-agent-runtime:integration jobforge-hello-ci-demo:latest
          docker compose -p jobforge-hello-ci -f deploy/demo/compose.yaml build web
          docker compose -p jobforge-hello-ci -f deploy/demo/compose.yaml up -d --no-build --wait
          python -m tools.demo_smoke
      - name: Stop owned free demo
        if: always() && matrix.shard == 'core'
        run: docker compose -p jobforge-hello-ci -f deploy/demo/compose.yaml stop
      - name: Real PostgreSQL, business actions, gRPC and process faults
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          pattern="$(python -m tools.ci_checks runtime --shard "$SHARD")"
          set -o pipefail
          docker run --rm --init --network host --add-host control:127.0.0.1 --cpus 2 --memory 512m --pids-limit 96 \
            -e JOBFORGE_TEST_DSN=postgres://jobforge:jobforge@127.0.0.1:5432/jobforge?sslmode=disable \
            -e JOBFORGE_BUSINESS_TEST_DSN=postgres://jobforge_business_bootstrap:jobforge_business_bootstrap@127.0.0.1:5434/jobforge_business?sslmode=disable \
            jobforge-agent-runtime:integration /app/integration.test -test.v -test.timeout=1200s "-test.run=$pattern" | tee runtime-tests.txt
          python -m tools.ci_checks verify-runtime --shard "$SHARD" --log runtime-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-${{ matrix.shard }}
          path: runtime-tests.txt

  image-contract:
    needs: changes
    if: needs.changes.outputs.image-contract == 'true'
    name: Production and operator image contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify installed sources and production boundaries
        run: python -m tools.check --only image-contract

  observability-config:
    needs: changes
    if: needs.changes.outputs.observability-config == 'true'
    name: Prometheus rules & generated dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Shared dashboard and alert checks
        run: python -m tools.check --only observability-config

  ci-required:
    name: CI required
    if: always()
    needs: [changes, docs, go-lint, go-test, python-lint, business-contract, executor-process-probe, proto-lint, agent-runtime-contract, image-contract, observability-config]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require every selected job to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_SELECTED: ${{ needs.changes.outputs.selected || '[]' }}
        run: python -m tools.ci_checks gate
