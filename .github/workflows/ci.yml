# Mechanical quality gate for JobForge.
#
# This workflow runs the checks declared in docs/development.md and
# CONTRIBUTING.md ("验证要求") on every pull request, so the local
# pre-commit checklist and the PR gate stay in sync. The check list maps to
# AGENTS.md "验证与汇报": format/lint/unit/integration/fault/race.
#
# Local equivalents (see docs/development.md):
#   go build ./... && go vet ./...
#   .tools/bin/golangci-lint run
#   go test -race ./...   (real PostgreSQL)
#   .venv/bin/python tools/check_sqlfluff_baseline.py
#   .venv/bin/sqlfluff lint migrations
#   .venv/bin/ruff check . && .venv/bin/ruff format --check .
#   .venv/bin/mypy sdk/python
#   .tools/bin/buf lint

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-lint:
    name: Go build, vet & golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  go-test:
    name: Go test (race, real PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobforge
          POSTGRES_PASSWORD: jobforge
          POSTGRES_DB: jobforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobforge -d jobforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Durable-event tests (PRD v0.3 §10.2): AOF-enabled Redis so AT-17/18/20
      # and NFR-303 run in CI with the same contract as the Windows compose
      # durable-events profile. The container filesystem survives stop/start,
      # which is what the restart-recovery tests rely on.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Credentials mirror deploy/compose.yaml local development values only.
      JOBFORGE_TEST_DSN: postgres://jobforge:jobforge@localhost:5432/jobforge?sslmode=disable
      JOBFORGE_TEST_REDIS_URL: redis://localhost:6379/0
      JOBFORGE_TEST_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SDK for real HTTP contract
        run: |
          python -m pip install --requirement tools/requirements-lint.txt
          python -m pip install --no-deps ./sdk/python
      - name: Configure Redis AOF and resolve container name
        run: |
          redis_container="$(docker ps --filter ancestor=redis:7-alpine --format '{{.Names}}' | head -1)"
          test -n "$redis_container"
          docker exec "$redis_container" redis-cli CONFIG SET appendonly yes
          docker exec "$redis_container" redis-cli CONFIG SET appendfsync everysec
          test "$(docker exec "$redis_container" redis-cli --raw CONFIG GET appendonly | tail -1)" = "yes"
          test "$(docker exec "$redis_container" redis-cli --raw CONFIG GET appendfsync | tail -1)" = "everysec"
          echo "JOBFORGE_TEST_REDIS_CONTAINER=$redis_container" >> "$GITHUB_ENV"
      - name: Test with race detector
        run: go test -race -count=1 ./...

  python-lint:
    name: Python ruff & mypy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned lint toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement tools/requirements-lint.txt
          python -m pip install --no-deps ./sdk/python
      - name: Python SDK tests
        run: python -m pytest sdk/python/tests
      - name: Agent S0 probe guardrails (no model calls)
        run: python -m pytest tools/agent_probe_data tools/executorprobe
      - name: Agent S1 adapters and authorized HTTP (real Linux clock, no model calls)
        run: python -m pytest python/tests
      - name: Support development data and semantic anchors (offline, no holdout)
        run: python -m pytest tools/support_evaluation
      - name: Validate SQLFluff historical baseline
        run: python tools/check_sqlfluff_baseline.py
      - name: SQLFluff migrations
        run: sqlfluff lint migrations
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy sdk/python
      - name: Agent S0 probe types
        run: mypy --platform linux tools/agent_model_probe.py tools/executorprobe/executor.py
      - name: Agent S1 business adapter types
        run: mypy python/jobforge_agent
      - name: Offline support evaluation types
        run: MYPYPATH=python:sdk/python mypy --explicit-package-bases tools/support_evaluation

  business-contract:
    name: Agent S1 business (real pgvector, HTTP, race)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install business adapter dependencies
        run: python -m pip install --requirement tools/requirements-lint.txt
      - name: Start isolated business database
        run: docker compose -f deploy/compose.agent.yaml up -d --wait business-postgres
      - name: Business database and HTTP contracts
        env:
          JOBFORGE_BUSINESS_TEST_DSN: postgres://jobforge_business_bootstrap:jobforge_business_bootstrap@127.0.0.1:5434/jobforge_business?sslmode=disable
          JOBFORGE_TEST_PYTHON: python
        run: go test -race -count=1 -v ./internal/business ./internal/jsonstrict ./tests/integration/business
      - name: Build the runtime image without evaluation labels
        run: docker compose -f deploy/compose.agent.yaml build business
      - name: Clean isolated development data
        if: always()
        run: docker compose -f deploy/compose.agent.yaml down --volumes

  executor-process-probe:
    name: Agent S0 executor (Linux process faults, race)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Go/Python probe image
        run: docker build --tag jobforge-executor-probe:s0 --file tools/executorprobe/Dockerfile .
      - name: Run real process lifecycle tests
        run: >-
          docker run --rm --init --network none --cpus 1 --memory 256m
          --pids-limit 64 jobforge-executor-probe:s0
      - name: Verify shared Go and Python BOOTTIME with race detector
        run: >-
          docker run --rm --init --network none --cpus 1 --memory 256m
          --pids-limit 64 jobforge-executor-probe:s0
          ./clock.test -test.v -test.timeout=30s

  proto-lint:
    name: Buf lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.72.0
          github_token: ${{ github.token }}
      - name: Buf lint
        run: buf lint

  agent-runtime-contract:
    name: Agent S1 runtime (real processes, PostgreSQL, race)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobforge
          POSTGRES_PASSWORD: jobforge
          POSTGRES_DB: jobforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobforge -d jobforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build fixed installed process checks
        run: docker build --target process-check -f tools/agentruntimecheck/Dockerfile -t jobforge-agent-runtime:process .
      - name: Actual guardian, step and parent death with race
        run: docker run --rm --init --network none --cpus 1 --memory 384m --pids-limit 64 jobforge-agent-runtime:process
      - name: Build explicitly synthetic HTTP mechanism image
        run: docker build --target integration-check -f tools/agentruntimecheck/Dockerfile -t jobforge-agent-runtime:integration .
      - name: Coordinator ordering with the real Linux clock
        run: docker run --rm --init --network none --cpus 1 --memory 384m --pids-limit 64 jobforge-agent-runtime:integration /app/worker.test -test.v -test.timeout=120s
      - name: Real PostgreSQL, gRPC, provider report confirmation and process faults
        run: >-
          docker run --rm --init --network host --add-host control:127.0.0.1 --cpus 2 --memory 512m --pids-limit 96
          -e JOBFORGE_TEST_DSN=postgres://jobforge:jobforge@127.0.0.1:5432/jobforge?sslmode=disable
          jobforge-agent-runtime:integration
      - name: Build production image and reject fixture registration
        run: |
          docker build -f deploy/Dockerfile.agent-worker -t jobforge-agent-worker:production .
          docker run --rm --init --network none --entrypoint python jobforge-agent-worker:production -I -c 'from jobforge_agent.runtime_registry import REGISTRY; from jobforge_agent.dispatch import DEEPSEEK_ORIGIN; from pathlib import Path; assert set(REGISTRY) == {"support-fixed-v1"}; assert REGISTRY["support-fixed-v1"].__class__.__module__ == "jobforge_agent.support_adapter"; assert DEEPSEEK_ORIGIN == "https://api.deepseek.com"; assert not Path("/tmp/test_install.py").exists(); assert not Path("/etc/jobforge/executor.json").exists(); assert not Path("/checks").exists(); assert not Path("/src/examples/support-agent/evaluation").exists()'

  observability-config:
    name: Prometheus rules & generated dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify dashboard generation
        run: |
          python tools/generate_task_dashboard.py
          git diff --exit-code -- deploy/grafana/dashboards/jobforge-tasks.json
      - name: Validate and test alert rules
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus:ro" --entrypoint promtool prom/prometheus:v3.14.0 check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus:ro" --entrypoint promtool prom/prometheus:v3.14.0 test rules /etc/prometheus/alerts.test.yml
